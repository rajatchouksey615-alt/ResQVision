name: Repository policy

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  naming-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check repository paths and contents
        run: python scripts/check_repository_policy.py --all

      - name: Check commit messages in this update
        shell: bash
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_repository_policy.py --commit-range "$COMMIT_RANGE"
