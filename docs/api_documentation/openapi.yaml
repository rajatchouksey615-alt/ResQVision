components:
  schemas:
    AccountProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - id
    ActivityKindEnum:
      enum:
      - PROGRESS_UPDATE
      - READINESS_UPDATE
      - COMPLETION_NOTE
      - UNABLE_TO_RESPOND_NOTE
      - GENERAL_NOTE
      type: string
      description: |-
        * `PROGRESS_UPDATE` - Progress update
        * `READINESS_UPDATE` - Readiness update
        * `COMPLETION_NOTE` - Completion note
        * `UNABLE_TO_RESPOND_NOTE` - Unable to respond note
        * `GENERAL_NOTE` - General note
    AssignmentCommandResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AssignmentSummary'
        replayed:
          type: boolean
      required:
      - data
      - replayed
    AssignmentComplete:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        details:
          type: string
          maxLength: 2000
      required:
      - command_id
      - details
    AssignmentStart:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        details:
          type: string
          maxLength: 2000
      required:
      - command_id
    AssignmentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident_id:
          type: string
          format: uuid
          readOnly: true
        target_organization_id:
          type: string
          format: uuid
          readOnly: true
        target_organization_kind:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentSummaryStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - incident_id
      - status
      - target_organization_id
      - target_organization_kind
      - updated_at
    AssignmentSummaryStatusEnum:
      enum:
      - PENDING
      - ACKNOWLEDGED
      - IN_PROGRESS
      - COMPLETED
      - UNABLE_TO_RESPOND
      - CANCELLED
      - EXPIRED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ACKNOWLEDGED` - Acknowledged
        * `IN_PROGRESS` - In progress
        * `COMPLETED` - Completed
        * `UNABLE_TO_RESPOND` - Unable to respond
        * `CANCELLED` - Cancelled
        * `EXPIRED` - Expired
    AssignmentUnable:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 2000
      required:
      - command_id
      - reason
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/SafeMembership'
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
      - memberships
      - roles
    CandidateReviewerAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        candidate_id:
          type: string
          format: uuid
          readOnly: true
        police_organization_id:
          type: string
          format: uuid
          readOnly: true
        reviewer_id:
          type: string
          format: uuid
          readOnly: true
        assigned_by_user_id:
          type: string
          format: uuid
          readOnly: true
        command_id:
          type: string
          format: uuid
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_at
      - assigned_by_user_id
      - candidate_id
      - command_id
      - id
      - police_organization_id
      - reviewer_id
    CandidateReviewerAssignmentCommandResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CandidateReviewerAssignment'
        replayed:
          type: boolean
      required:
      - data
      - replayed
    CandidateReviewerAssignmentInput:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        reviewer_id:
          type: string
          format: uuid
      required:
      - command_id
      - reviewer_id
    CandidateSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        police_organization_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CandidateSummaryStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - police_organization_id
      - status
      - updated_at
    CandidateSummaryStatusEnum:
      enum:
      - RECEIVED
      - UNDER_REVIEW
      - VERIFIED
      - REJECTED
      type: string
      description: |-
        * `RECEIVED` - Received
        * `UNDER_REVIEW` - Under review
        * `VERIFIED` - Verified
        * `REJECTED` - Rejected
    CommandID:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
      required:
      - command_id
    DetectionEventCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        received_at:
          type: string
          format: date-time
      required:
      - id
      - received_at
    DetectionEventInput:
      type: object
      properties:
        video_source_id:
          type: string
          format: uuid
        external_event_id:
          type: string
          maxLength: 128
        model_name:
          type: string
          maxLength: 100
        model_version:
          type: string
          maxLength: 100
        detected_at:
          type: string
          format: date-time
        processing_outcome:
          $ref: '#/components/schemas/ProcessingOutcomeEnum'
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          nullable: true
        payload_sha256:
          type: string
          nullable: true
          pattern: ^[0-9a-fA-F]{64}$
        metadata_schema_version:
          type: integer
          minimum: 1
          default: 1
        auxiliary_metadata:
          type: object
          additionalProperties: {}
      required:
      - detected_at
      - external_event_id
      - model_name
      - model_version
      - processing_outcome
      - video_source_id
    EmailTokenObtainPair:
      type: object
      description: Authenticate using the canonical email address and generic failures.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        errors: {}
        request_id:
          type: string
          format: uuid
      required:
      - code
      - detail
    IncidentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IncidentSummaryStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - status
      - updated_at
    IncidentSummaryStatusEnum:
      enum:
      - OPEN
      - RESPONSE_ACTIVE
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `RESPONSE_ACTIVE` - Response active
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    Logout:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    NotificationCommandResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NotificationSummary'
        replayed:
          type: boolean
      required:
      - data
      - replayed
    NotificationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/NotificationSummaryStatusEnum'
          readOnly: true
